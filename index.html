@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{opacity:.07}}
:root[data-theme="dark"] body::before{opacity:.07}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 var(--font-ui);-webkit-tap-highlight-color:transparent;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:14px 0 120px;overflow-x:clip}
h1,h2,h3{margin:0;font-weight:600}
.num{font-family:var(--font-num);font-weight:600;letter-spacing:.01em}
.muted{color:var(--muted)}.small{font-size:14px}
.title{font-size:34px;line-height:1.05;margin:10px 0 4px}
.stack{display:grid;gap:12px}
label.f{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.inp,select.inp{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:18px}
input.num-in{font-family:var(--font-num);font-weight:600;font-size:24px;text-align:center}
.btn{min-height:56px;border-radius:14px;font-weight:600;font-size:18px;padding:0 16px;border:1.5px solid var(--line);background:var(--card)}
.btn.primary{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.btn.full{width:100%}.btn:disabled{opacity:.45}
.pill{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.pill.s{min-height:38px;font-size:15px}
.panel{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:14px}
.rnd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rnd .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hr{height:1px;background:var(--line);margin:18px 0}
.msg{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--ok);font-size:15px}.msg.err{background:var(--bad)}
.ph{display:grid;gap:6px;margin-top:6px}
.ph .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--bg)}
.ph .row b{font-family:var(--font-num);font-size:24px}
.prow{display:grid;grid-template-columns:1fr 84px auto 44px;gap:8px;align-items:center;margin-bottom:8px}
.prow .del{height:44px;border-radius:10px;border:1.5px solid var(--line);color:var(--flag);font-weight:700}
/* Kopf */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 10px}
.where{font-size:14px;color:var(--muted);line-height:1.2}
.hole-no{font-size:48px;line-height:.95;white-space:nowrap}.hole-no small{font-size:20px;font-weight:500;color:var(--muted);margin-left:6px}
.par-btn{min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:16px;white-space:nowrap}
.par-btn b{font-family:var(--font-num);font-size:30px;margin-left:4px;vertical-align:-3px}
.linkbtn{min-height:44px;padding:0 12px;border-radius:10px;color:var(--pine);font-weight:600;border:1.5px solid var(--line);background:var(--card)}
/* Spielstand */
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin-bottom:12px}
.team{border-radius:14px;padding:8px 10px;min-width:0}
.team.a{background:var(--ta)}.team.b{background:var(--tb)}
.team .n{font-size:13px;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.team .p{font-size:40px;line-height:1}
.vs{display:flex;align-items:center;color:var(--muted);font-size:14px}
/* Streifen */
.strip{background:var(--card);border-radius:14px;padding:8px;margin-bottom:12px;border:1px solid var(--line)}
.srow{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;margin:2px 0}
.cell{min-width:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:46px;border-radius:8px;border:1.5px solid transparent}
.cell .n{font-size:10px;color:var(--muted);line-height:1}
.cell .r{font-family:var(--font-num);font-weight:700;font-size:15px;line-height:1.1;padding:1px 4px;border-radius:5px}
.cell .r.a{background:var(--ta)}.cell .r.b{background:var(--tb)}.cell .r.t{color:var(--muted)}
.cell.cur{border-color:var(--pine)}
/* Spielerzeilen */
.pr{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr .bar{align-self:stretch;border-radius:4px;background:var(--pine)}.pr.b .bar{background:var(--amber)}
.pr .nm{font-weight:600;overflow-wrap:anywhere;line-height:1.15}.pr .sub{font-size:13px;color:var(--muted)}
.stp{display:flex;align-items:center;gap:6px}
.step{width:60px;height:60px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);font-size:30px;font-weight:600;display:flex;align-items:center;justify-content:center}
.step:active{background:var(--line)}
.val{font-size:54px;line-height:1;min-width:64px;text-align:center}
.res{margin-top:12px;display:grid;gap:8px}
.res .l{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg)}
.res .l .w{font-weight:600}.res .l.a .w{color:var(--pine)}.res .l.b .w{color:var(--amber)}
/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;padding:10px max(14px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:5}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
/* Tabelle */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{padding:7px 5px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th{font-size:12px;color:var(--muted);font-weight:500}
table.t td.a{background:var(--ta)}table.t td.b{background:var(--tb)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.kpi{border-radius:14px;padding:12px;text-align:center}.kpi.a{background:var(--ta)}.kpi.b{background:var(--tb)}
.kpi .v{font-size:46px;line-height:1}.kpi .l{font-size:13px;color:var(--muted)}
.sync{font-size:13px;color:var(--muted)}
.bdg{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;margin:2px 4px 0 0;border:1.5px solid var(--line)}
.bdg.g{background:var(--gold);color:var(--goldink);border-color:var(--gold)}.bdg.r{background:var(--red);color:var(--redink);border-color:var(--rosab)}
.p3b{min-height:40px;padding:0 12px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;margin-top:4px}
.p3b.on{border-color:var(--rosab);color:var(--rosab)}
.p3b.lad.on{border-color:var(--vio);color:var(--vio)}
.bdg.v{background:var(--vio);color:var(--vioink);border-color:var(--vio)}
.c3{display:inline-block;min-width:22px;height:22px;line-height:18px;padding:0 3px;border:2px solid var(--rosab);border-radius:50%;text-align:center;box-sizing:border-box}
.c3.cb{border-color:var(--goldb)}
.chip{display:inline-block;min-width:22px;height:22px;line-height:22px;padding:0 3px;border-radius:50%;text-align:center;box-sizing:border-box}
.fr{background:var(--red);color:var(--redink)}.fg{background:var(--gold);color:var(--goldink)}.fp{background:var(--vio);color:var(--vioink)}
sup.lad{color:var(--vio);font-weight:700;font-size:11px;margin-left:2px}
.val.g{background:var(--gold);color:var(--goldink);border-radius:12px}

.sp{display:grid;gap:6px;margin:12px 0}.sp .l{padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px}
@media (prefers-reduced-motion:no-preference){.step,.pill,.btn{transition:background .12s}}
.thd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 0 4px;font-weight:700;font-size:15px;border-bottom:1px solid var(--line)}.thd span:last-child{font-weight:600;font-size:13px;color:var(--muted,#667)}
.parcol{display:flex;flex-direction:column;align-items:flex-end}.hcpb{font-size:13px;color:var(--muted,#667);margin-top:4px;padding-right:4px}
.acc{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:inherit;font:inherit;text-align:left}

});
document.addEventListener("click",function(e){var b=e.target.closest("[data-act]");if(!b||!app.contains(b))return;var a=b.getAttribute("data-act"),id=b.getAttribute("data-id"),r=curRound();

    case "start":{readDraft();var msg=$("#dmsg"),ids=activeIds(draft).slice(),pl=rf(draft,{});

      if(needsSI(draft)&&!siDraft(draft)){msg.innerHTML='<div class="msg err">Für Netto fehlt der Stroke Index dieses Platzes. Bitte alle 18 Werte (1 bis 18, jede Zahl einmal) eintragen.</div>';return;}

    case "fixdraft":draft=null;view="home";render();break;

  }});
